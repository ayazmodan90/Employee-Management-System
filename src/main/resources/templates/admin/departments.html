<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Departments</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            padding: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #38bdf8;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            transition: 0.3s;
        }

        .add-btn {
            background: #22c55e;
        }

        .add-btn:hover {
            background: #16a34a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #334155;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-top: 1px solid #475569;
        }

        tr:hover {
            background: #334155;
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
        }

        .edit-btn {
            background: #3b82f6;
            color: white;
        }

        .edit-btn:hover {
            background: #2563eb;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🏢 Department Management</h2>

    <div class="top-bar">
        <div></div>
        <a th:href="@{/admin/departments/add}" class="btn add-btn">+ Add Department</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Department Name</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(departments)}">
            <td colspan="4" class="empty">No departments found</td>
        </tr>

        <tr th:each="dept : ${departments}">
            <td th:text="${dept.id}"></td>
            <td th:text="${dept.name}"></td>
            <td th:text="${dept.description}"></td>
            <td>
                <a th:href="@{'/admin/departments/edit/' + ${dept.id}}"
                   class="action-btn edit-btn">Edit</a>

                <a th:href="@{'/admin/departments/delete/' + ${dept.id}}"
                   class="action-btn delete-btn"
                   onclick="return confirm('Are you sure to delete?')">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
