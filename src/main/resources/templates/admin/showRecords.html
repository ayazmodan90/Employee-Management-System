<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Management — HRCore</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.css">

<style>
:root {
  --bg: #0d0f14;
  --card: #181c27;
  --border: #252a38;
  --accent: #4f8ef7;
  --accent2: #a78bfa;
  --text: #e8eaf0;
  --muted: #6b7280;
  --danger: #f87171;
}

body {
  margin: 0;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* Background glow */
.bg-glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .12;
}
.blue { width:500px;height:500px;background:#4f8ef7;top:-100px;right:-100px; }
.purple { width:400px;height:400px;background:#a78bfa;bottom:-80px;left:-80px; }

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 50px;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon {
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
}

.brand-name {
  font-family:'Playfair Display',serif;
  font-size:20px;
}

/* Button */
.add-btn {
  padding:10px 18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:500;
  transition:0.3s;
}
.add-btn:hover {
  opacity:0.85;
}

/* Card */
.container {
  margin: 20px 50px;
  background: var(--card);
  padding: 30px;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

/* Table Styling */
table.dataTable {
  color: var(--text);
}

table.dataTable thead {
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  color: white;
}

.dataTables_wrapper .dataTables_filter input {
  background: #13161e;
  border: 1px solid var(--border);
  color: white;
  border-radius: 8px;
  padding: 5px 10px;
}

/* Links */
.edit-link {
  color: var(--accent);
  font-weight: 500;
  text-decoration: none;
}
.edit-link:hover {
  text-decoration: underline;
}

.delete-link {
  color: var(--danger);
  font-weight: 500;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="bg-glow blue"></div>
<div class="bg-glow purple"></div>

<!-- Header -->
<div class="header">
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <span class="brand-name">HRCore</span>
  </div>

  <a class="add-btn" th:href="@{/addEmployee}">+ Add Employee</a>
</div>

<!-- Table Card -->
<div class="container">

<table id="employeeTable" class="display">
<thead>
<tr>
<th>ID</th>
<th>First Name</th>
<th>Last Name</th>
<th>Email</th>
<th>Salary</th>
<th>Department</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr th:each="emp : ${listEmployees}">
    <td th:text="${emp.id}"></td>
    <td th:text="${emp.firstName}"></td>
    <td th:text="${emp.lastName}"></td>
    <td th:text="${emp.email}"></td>
    <td th:text="${emp.salary}"></td>
    <td th:text="${emp.department}"></td>

    <td>
        <a class="edit-link"
           th:href="@{/admin/showFormForUpdate/{id}(id=${emp.id})}">
           Edit
        </a>

        &nbsp;|&nbsp;

        <a class="delete-link"
           href="#"
           th:onclick="|confirmDelete(${emp.id})|">
           Delete
        </a>

        &nbsp;|&nbsp;

        <!-- 🔥 SALARY BUTTON -->
        <a th:href="@{'/admin/paySalary/' + ${emp.id}}">
            💰 Pay Salary
        </a>
    </td>
</tr>

</tbody>
</table>

</div>
<script>
$(document).ready(function () {
    $('#employeeTable').DataTable();
});

function confirmDelete(id){
Swal.fire({
title: "Are you sure?",
text: "This action cannot be undone!",
icon: "warning",
showCancelButton: true,
confirmButtonColor: "#4f8ef7",
cancelButtonColor: "#f87171",
confirmButtonText: "Delete"
}).then((result) => {
if (result.isConfirmed) {
window.location.href = "/deleteEmployee/" + id;
}
});
}
</script>

</body>
</html>
