<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<title th:text="${employee.id == null} ? 'Add Employee' : 'Update Employee'">Add Employee</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>

<style>
:root {
    --bg: #0d0f14;
    --card: #181c27;
    --border: #252a38;
    --accent: #4f8ef7;
    --accent2: #a78bfa;
    --text: #e8eaf0;
    --muted: #6b7280;
    --success: #34d399;
}

body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

/* Background glow */
.bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .12;
    pointer-events: none;
}
.bg-glow.blue { width:500px;height:500px;background:#4f8ef7;top:-100px;right:-100px; }
.bg-glow.purple { width:400px;height:400px;background:#a78bfa;bottom:-80px;left:-80px; }

/* Card */
.container {
    background: var(--card);
    padding: 50px 40px;
    width: 450px;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 40px 100px rgba(0,0,0,.5);
    position: relative;
    z-index: 1;
}

/* Header */
h2 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 30px;
}

/* Form labels and inputs */
label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
    display: block;
    color: var(--muted);
}

input {
    width: 100%;
    padding: 12px 15px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 18px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
}

input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,142,247,.12);
}

/* Submit Button */
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
}
button:hover { opacity: .9; transform: translateY(-1px); }
button:active { transform: translateY(0); }

/* Back link */
.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
}
.back-link:hover { text-decoration: underline; }

</style>
</head>
<body>

<div class="bg-glow blue"></div>
<div class="bg-glow purple"></div>

<div class="container">

<h2 th:text="${employee.id == null} ? 'Add Employee' : 'Update Employee'">Add Employee</h2>

<form th:action="@{/admin/saveEmployee}" th:object="${employee}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>First Name</label>
    <input type="text" th:field="*{firstName}" placeholder="John" required>

    <label>Last Name</label>
    <input type="text" th:field="*{lastName}" placeholder="Doe" required>

    <label>Email</label>
    <input type="email" th:field="*{email}" placeholder="john.doe@example.com" required>

    <label>Department</label>
    <input type="text" th:field="*{department}" placeholder="IT" required>

    <label>Salary</label>
    <input type="number" th:field="*{salary}" placeholder="50000" required>

    <button type="submit">Save</button>
</form>

<a class="back-link" th:href="@{/admin/employees}">← Back to Employee List</a>

</div>

</body>
</html>
