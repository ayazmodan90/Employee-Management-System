<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — HRCore</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#0d0f14;--surface:#13161e;--card:#181c27;--border:#252a38;--accent:#4f8ef7;--accent2:#a78bfa;--text:#e8eaf0;--muted:#6b7280;--danger:#f87171;--success:#34d399;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    .bg-glow{position:fixed;border-radius:50%;filter:blur(100px);opacity:.1;pointer-events:none;}
    .bg-glow.blue{width:400px;height:400px;background:#4f8ef7;bottom:-80px;left:-80px;}
    .bg-glow.purple{width:350px;height:350px;background:#a78bfa;top:-60px;right:-60px;}
    .grid-lines{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.25;pointer-events:none;}

    .wrapper{width:460px;max-width:95vw;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:52px 48px;box-shadow:0 40px 100px rgba(0,0,0,.5);animation:fadeUp .6s ease both;position:relative;z-index:1;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

    .brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
    .brand-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;}
    .brand-name{font-family:'Playfair Display',serif;font-size:20px;}

    .icon-wrap{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,rgba(52,211,153,.15),rgba(79,142,247,.15));border:1px solid rgba(52,211,153,.25);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:24px;}
    h3{font-size:24px;font-weight:600;margin-bottom:8px;}
    .sub{color:var(--muted);font-size:14px;margin-bottom:30px;line-height:1.6;}

    .form-group{margin-bottom:20px;}
    label{display:block;font-size:11px;font-weight:500;color:#9ca3af;letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px;}
    .input-wrap{position:relative;}
    .input-wrap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.45;pointer-events:none;}
    input[type="password"]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px 13px 40px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s;}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.12);}
    input[type="hidden"]{}

    .requirements{font-size:12px;color:var(--muted);margin-top:8px;display:flex;flex-direction:column;gap:4px;}
    .req{display:flex;align-items:center;gap:6px;}
    .req.met{color:var(--success);}
    .req::before{content:'○';font-size:10px;}
    .req.met::before{content:'✓';}

    .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s,transform .1s;}
    .btn-primary:hover{opacity:.9;transform:translateY(-1px);}
    .back-link{display:flex;align-items:center;gap:6px;margin-top:22px;font-size:13px;color:var(--muted);text-decoration:none;justify-content:center;transition:color .2s;}
    .back-link:hover{color:var(--accent);}
  </style>
</head>
<body>
<div class="bg-glow blue"></div>
<div class="bg-glow purple"></div>
<div class="grid-lines"></div>

<div class="wrapper">
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <span class="brand-name">HRCore</span>
  </div>

  <div class="icon-wrap">🛡️</div>
  <h3>Set new password</h3>
  <p class="sub">Your new password must be different from your previous password.</p>

  <form th:action="@{/auth/reset-password}" method="post">
    <input type="hidden" name="email" th:value="${email}"/>

    <div class="form-group">
      <label>New Password</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" id="newPwd" name="password" placeholder="Enter new password" required oninput="checkReqs(this.value)"/>
      </div>
      <div class="requirements">
        <div class="req" id="r1">At least 8 characters</div>
        <div class="req" id="r2">One uppercase letter</div>
        <div class="req" id="r3">One number</div>
      </div>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" id="confPwd" placeholder="Repeat new password" required/>
      </div>
    </div>

    <button type="submit" class="btn-primary">Reset Password →</button>
  </form>

  <a class="back-link" th:href="@{/auth/mlogin}">← Back to Sign In</a>
</div>

<script>
  function checkReqs(v) {
    document.getElementById('r1').className = 'req' + (v.length >= 8 ? ' met' : '');
    document.getElementById('r2').className = 'req' + (/[A-Z]/.test(v) ? ' met' : '');
    document.getElementById('r3').className = 'req' + (/[0-9]/.test(v) ? ' met' : '');
  }
</script>
</body>
</html>
