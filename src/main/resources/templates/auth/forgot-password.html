<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — HRCore</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box;margin:0;padding:0; }
    :root {
      --bg:#0d0f14;--surface:#13161e;--card:#181c27;--border:#252a38;
      --accent:#4f8ef7;--accent2:#a78bfa;--text:#e8eaf0;--muted:#6b7280;--danger:#f87171;
    }
    body { font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative; }
    .bg-glow { position:fixed;border-radius:50%;filter:blur(100px);opacity:.1;pointer-events:none; }
    .bg-glow.blue { width:400px;height:400px;background:#4f8ef7;top:-80px;left:-80px; }
    .bg-glow.purple { width:350px;height:350px;background:#a78bfa;bottom:-60px;right:-60px; }
    .grid-lines { position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.25;pointer-events:none; }

    .wrapper { width:460px;max-width:95vw;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:52px 48px;box-shadow:0 40px 100px rgba(0,0,0,.5);animation:fadeUp .6s ease both;position:relative;z-index:1; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

    .brand { display:flex;align-items:center;gap:10px;margin-bottom:32px; }
    .brand-icon { width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px; }
    .brand-name { font-family:'Playfair Display',serif;font-size:20px; }

    .icon-wrap { width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,rgba(79,142,247,.15),rgba(167,139,250,.15));border:1px solid rgba(79,142,247,.25);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:24px; }
    h3 { font-size:24px;font-weight:600;margin-bottom:8px; }
    .sub { color:var(--muted);font-size:14px;margin-bottom:30px;line-height:1.6; }

    .alert-danger { background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--danger);margin-bottom:18px; }
    .alert-success { background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:10px;padding:12px 16px;font-size:13px;color:#34d399;margin-bottom:18px; }

    .form-group { margin-bottom:20px; }
    label { display:block;font-size:11px;font-weight:500;color:#9ca3af;letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px; }
    .input-wrap { position:relative; }
    .input-wrap .icon { position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.45;pointer-events:none; }
    input[type="email"] { width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px 13px 40px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s; }
    input:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.12); }

    .btn-primary { width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s,transform .1s; }
    .btn-primary:hover { opacity:.9;transform:translateY(-1px); }
    .btn-primary:active { transform:translateY(0); }

    .back-link { display:flex;align-items:center;gap:6px;margin-top:22px;font-size:13px;color:var(--muted);text-decoration:none;justify-content:center;transition:color .2s; }
    .back-link:hover { color:var(--accent); }
  </style>
</head>
<body>
<div class="bg-glow blue"></div>
<div class="bg-glow purple"></div>
<div class="grid-lines"></div>

<div class="wrapper">
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <span class="brand-name">HRCore</span>
  </div>

  <div class="icon-wrap">🔑</div>
  <h3>Forgot password?</h3>
  <p class="sub">No worries! Enter your registered email and we'll help you reset your password.</p>

  <div class="alert-danger" th:if="${error}" th:text="${error}"></div>

  <form th:action="@{/auth/forgot-password}" method="post">
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="icon">✉</span>
        <input type="email" name="email" placeholder="you@company.com" required/>
      </div>
    </div>
    <button type="submit" class="btn-primary">Send Reset Link →</button>
  </form>

  <a class="back-link" th:href="@{/auth/mlogin}">← Back to Sign In</a>
</div>
</body>
</html>
