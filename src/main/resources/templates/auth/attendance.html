<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Attendance</title>

    <style>
        body {
            font-family: Arial;
            background: #0d0f14;
            color: white;
            text-align: center;
            padding: 50px;
        }

        .card {
            background: #181c27;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            margin: auto;
        }

        button {
            padding: 12px 20px;
            background: #4f8ef7;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .present {
            color: lightgreen;
            font-size: 18px;
        }

        .absent {
            color: red;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Welcome, <span th:text="${user.name}"></span></h2>
    <h3>Today's Attendance</h3>

    <!-- IF PRESENT -->
    <div th:if="${attendance != null}">
        <p class="present">✅ Present</p>
        <p th:text="'Date: ' + ${attendance.date}"></p>
    </div>

    <!-- IF ABSENT -->
    <div th:if="${attendance == null}">
        <p class="absent">❌ Absent</p>

        <form th:action="@{/auth/attendance/mark}" method="post">
            <button type="submit">Mark Present</button>
        </form>
    </div>

</div>

</body>
</html>
