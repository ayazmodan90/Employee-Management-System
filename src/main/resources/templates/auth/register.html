<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — HRCore</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14; --surface: #13161e; --card: #181c27; --border: #252a38;
      --accent: #4f8ef7; --accent2: #a78bfa; --text: #e8eaf0; --muted: #6b7280;
      --danger: #f87171; --success: #34d399;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .bg-glow { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .12; pointer-events: none; }
    .bg-glow.blue   { width:500px;height:500px;background:#4f8ef7;top:-100px;right:-100px; }
    .bg-glow.purple { width:400px;height:400px;background:#a78bfa;bottom:-80px;left:-80px; }
    .grid-lines {
      position:fixed;inset:0;
      background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
      background-size:60px 60px;opacity:.3;pointer-events:none;
    }
    .wrapper {
      width: 520px; max-width: 95vw;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 52px 48px;
      box-shadow: 0 40px 100px rgba(0,0,0,.5);
      animation: fadeUp .6s ease both;
      position: relative; z-index:1;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

    .brand { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
    .brand-icon {
      width:36px;height:36px;border-radius:9px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;font-size:16px;
    }
    .brand-name { font-family:'Playfair Display',serif; font-size:20px; }

    h3 { font-size:26px; font-weight:600; }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; margin-bottom:28px; }

    .alert-danger {
      background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);
      border-radius:10px;padding:12px 16px;font-size:13px;color:var(--danger);margin-bottom:18px;
    }

    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

    .form-group { margin-bottom:18px; }
    label { display:block;font-size:11px;font-weight:500;color:#9ca3af;letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px; }
    .input-wrap { position:relative; }
    .input-wrap .icon { position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.45;pointer-events:none; }
    input[type="text"], input[type="email"], input[type="password"] {
      width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;
      padding:12px 13px 12px 40px;color:var(--text);font-size:14px;
      font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s;
    }
    input:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.12); }

    .password-strength { margin-top:6px; display:flex; gap:4px; }
    .strength-bar { height:3px; flex:1; border-radius:2px; background:var(--border); transition:background .3s; }

    .btn-primary {
      width:100%;padding:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;
      cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s,transform .1s;
      margin-top:6px;
    }
    .btn-primary:hover { opacity:.9; transform:translateY(-1px); }
    .btn-primary:active { transform:translateY(0); }

    .login-link { text-align:center;font-size:13px;color:var(--muted);margin-top:22px; }
    .login-link a { color:var(--accent);text-decoration:none;font-weight:500; }
    .login-link a:hover { text-decoration:underline; }

    .terms { font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6; }
    .terms a { color:var(--muted);text-decoration:underline; }
  </style>
</head>
<body>
<div class="bg-glow blue"></div>
<div class="bg-glow purple"></div>
<div class="grid-lines"></div>

<div class="wrapper">
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <span class="brand-name">HRCore</span>
  </div>

  <h3>Create account</h3>
  <p class="sub">Join your team's workspace today</p>

  <div class="alert-danger" th:if="${error}" th:text="${error}"></div>

  <form th:action="@{/auth/register}" th:object="${user}" method="post">
    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap">
        <span class="icon">👤</span>
        <input type="text" th:field="*{name}" placeholder="John Doe" required/>
      </div>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="icon">✉</span>
        <input type="email" th:field="*{email}" placeholder="you@company.com" required/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" th:field="*{password}" id="pwd" placeholder="Min 8 chars" required
                 oninput="checkStrength(this.value)"/>
        </div>
        <div class="password-strength">
          <div class="strength-bar" id="s1"></div>
          <div class="strength-bar" id="s2"></div>
          <div class="strength-bar" id="s3"></div>
          <div class="strength-bar" id="s4"></div>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" placeholder="Repeat password" required/>
        </div>
      </div>
    </div>

    <button type="submit" class="btn-primary">Create Account →</button>
  </form>

  <div class="login-link">Already have an account? <a th:href="@{/auth/mlogin}">Sign in</a></div>
  <p class="terms">By creating an account you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
</div>

<script>
  function checkStrength(val) {
    const bars = [s1,s2,s3,s4];
    const colors = ['#f87171','#fb923c','#facc15','#34d399'];
    let score = 0;
    if (val.length >= 8)      score++;
    if (/[A-Z]/.test(val))    score++;
    if (/[0-9]/.test(val))    score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    bars.forEach((b,i)=> b.style.background = i < score ? colors[score-1] : 'var(--border)');
  }
</script>
</body>
</html>
